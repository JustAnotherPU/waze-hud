# jap-waze-on-cluster settings. Values shown are the built-in defaults; any key can
# also be given on the command line as -s key=value. The unit's own settings go
# in local_conf, which updates keep; each key there replaces the value here.
# "CAR-ONLY" marks values only a SOME/IP trace or a live CarPlay session on the
# unit can settle.
local_conf = /var/opt/jap-waze-on-cluster/jap-waze-on-cluster.local.conf

# --- control socket ---------------------------------------------------------
socket_path = /dev/shm/jap-waze-on-cluster/ctl.sock
socket_mode = 0660
socket_group =

# --- log file ---------------------------------------------------------------
# Every log line is also appended here with its UTC time and level, so a
# report reaches past the journal's few minutes on the unit and across
# restarts (collect-logs.sh gathers it). A line that would take the file past
# log_file_kb (16-16384) first renames it to <log_file>.1, replacing that: at
# most about twice log_file_kb on /var/opt. jap-waze-on-cluster.service makes the
# directory, owned by hmi_5000, at each start. Empty: no file.
log_file = /var/opt/jap-waze-on-cluster/log/jap-waze-on-cluster.log
log_file_kb = 512

# --- capture ----------------------------------------------------------------
# The 2nd stream reaches this tool by one of the sink patches; the render
# listens on all of them, so the mode is a patch choice, not a render restart:
#   avb mode   — the sink stays the stock media-bus stream (avb_stream) and
#                this tool joins it as an extra receiver, in-process. The
#                mode the app applies.
#   fifo mode  — carplay writes a file:// FIFO (fifo_path). carplay_group is the
#                group that may traverse the FIFO's directory and write it:
#                "video" (gid 44) is the one group both this tool's user
#                (hmi_5000) and carplay (cia_13002) belong to (VERIFIED). On
#                the car the projection bridge rejected a file:// sink.
#   udp mode   — carplay writes udp://127.0.0.1:<udp_port>; udp://tcp:// map
#                to Cinemo's NmeVfsSocket (its scheme strings live in that
#                class), the local stream sink.
fifo_path = /run/jap-waze-on-cluster/alt.h264
carplay_group = video
udp_port = 20557
avb_stream = media_transport.avb_streaming.15

# --- decode -----------------------------------------------------------------
# Intel Media SDK / VAAPI render node. hmi_5000 is in the video group, so the
# render process can open it (VERIFIED: /etc/group, 20-dri-permissions.rules).
drm_device = /dev/dri/renderD128
# Decode target: the cluster's 1088x480 central map area, pixel for pixel.
# The patch advertises this size to the phone (PATCH.md Edit 4), so the phone
# renders tex_size pixels and the decoder passes them through unscaled. Keep
# it equal to the resolution the patch applied (its 1088x480 default), or the
# decoder scales between the two; the render reads tex_size from this file
# only. Even sizes up to 1088x480, the width a multiple of 4.
#
# The map is one R8 buffer on the cluster holding the decoded picture's own
# Y, U and V planes (783,360 B at 1088x480), which the cluster's GPU turns
# into colour; each update writes only the parts that changed, in place
# (README.md "Map size and upload"). A height that is a multiple of 4 also
# allows pan_blocks.
tex_size = 1088x480
# The part of a padded picture that is the map: "SWxSH:X,Y,W,H", applied to
# each picture of exactly SW x SH, which VPP then scales to tex_size (1:1 when
# W x H is tex_size). A phone can send a picture larger than the map it draws
# in it, padded with black (Android Auto's cluster view: a 1280x720 stream with
# the map in its top 1280x564); the picture is otherwise squeezed whole into the
# map. A picture of any other size (CarPlay's, already tex_size) is used
# whole. With src_crop set, the decoder logs each picture size it sees.
# Every number even. A value that cannot be used is ignored, with a warning.
# Empty (the built-in default): the whole picture. This one is the Android
# Auto patch's picture with the turn card shown (PATCH.md "Android Auto");
# with it hidden, patchd passes its crop on the command line.
src_crop = 1280x720:0,0,1280,564
# Where the map is drawn in its target, "X,Y,W,H" in the target's pixels from
# its top-left (map: the 1088x480 slot), whichever target is current. The map
# is stretched to the rect, whatever its shape. Empty: the whole map area. One
# outside the target, or a value that cannot be used, is ignored, with a
# warning.
map_rect =
# Each Y, U and V level rounded to the nearest multiple of 2^bits before it
# is compared and written (0-3): at most 2^(bits-1) levels off, with 0, 128
# (neutral chroma) and 255 exact. 0: exact.
tex_level_bits = 2
# Noise filter: a 64x64 tile whose Y, U and V all differ from what the cluster
# shows by at most dirty_threshold (0-64) levels is not written, so the
# decoder's noise on a still map costs nothing. A tile left slightly
# different is written after dirty_settle_ms anyway (0: never). 0: every
# difference is written. The probe report's tile-difference line shows where
# the noise ends.
dirty_threshold = 8
dirty_settle_ms = 1000

# --- the shared renderer ----------------------------------------------------
# The map is a video layer of the shared cluster renderer (cluster-render),
# which owns the RAMSES participant, the DCSM slots, the scene ids and the one
# upload budget all its clients share (its cluster-render.conf).
render_socket = /dev/shm/cluster-render/render.sock
# Where the map goes: "map" (the native central-map slot 0x100, whose
# 1088x480 scene the map fills under the gauges), "panel" (the whole
# cluster, the map centred) or "hud". A control start changes it until the
# service restarts.
target = map
# 1: BMW's turn-by-turn box on the cluster stays hidden while the map shows
# (the map layer's guide_hold; cluster-render README "Guide hold"); 0: it
# shows. The app's switch keeps its choice in state_file, which replaces
# this value; other than 0 or 1, either counts as 1. The service makes
# state_file's folder, owned by hmi_5000, at each start.
hide_bmw_guidance = 1
state_file = /var/opt/jap-waze-on-cluster/state/jap-waze-on-cluster.state.conf

# --- the map layer --------------------------------------------------------------
# The map is up while CarPlay's cluster stream is live, from its first
# non-blank picture, and down when it ends, so the stock map returns. Live: carplay's
# connection for the stream (the alternate screen) on this TCP port, owned by
# this uid (/proc/net/tcp6), whatever the frame rate; how often a static map
# sends a frame depends on the phone (one about every ten seconds, another
# about 30 a second). 0 turns the connection off as a signal.
# CAR-ONLY: that the connection ends with the stream.
alt_screen_port = 6031
alt_screen_uid = 13002
# Without that connection (carplay took another port), or while /proc/net
# cannot be read: live while a frame was decoded within this long.
stall_ms = 6000
# Live but no frame for this long: the map comes down anyway, so a connection
# that outlives its frames does not leave a stale map. A static map can send
# a frame only every ten seconds, depending on the phone.
idle_ms = 60000
# Blank: the phone sends a blank picture while no navigation app draws the
# cluster (at the stream's start, until a route starts). The stock map stays
# until the first non-blank picture, and is back once the picture has stayed
# blank for blank_ms (1000-600000); the next non-blank picture brings the map
# again. Meanwhile the app says to start navigation, or to reconnect CarPlay
# while the stream is frozen (below), which also takes the map down.
# CAR-ONLY: what each navigation app sends without a route.
blank_ms = 10000
# Frozen: frames keep coming, at least freeze_min_fps a second, all the same
# blank picture for freeze_ms (on the car 15-21 a second until CarPlay
# reconnects); three times freeze_ms for a stream that has shown no picture
# yet. A static map is never frozen, whatever its frame rate. The map
# is down while frozen and the app says to reconnect CarPlay. freeze_ms 0:
# never frozen.
freeze_ms = 10000
freeze_min_fps = 3
# Updates written to the cluster a second, at most, on an exact grid (a
# missed deadline is skipped, never made up). The phone's frame rate is the
# real ceiling: the cluster can be updated no faster than frames arrive.
target_fps = 30
# 1: an update whose exact write costs more than a third of the atlas and
# more than the shared budget allows at that moment goes as 4x4 colour blocks
# (261,120 B at 1088x480, slightly softer) instead of waiting for the budget;
# the next update the budget covers, or a quarter second after the last
# packed one with no new frame written, brings the exact picture back.
# 0: every update is exact.
pan_blocks = 1

# --- HUD arrows (README.md "HUD arrows") ------------------------------------------
# Waze sends CarPlay no route guidance, so BMW's HUD shows no arrows for it.
# arrows: Waze's banner is read from the cluster map's frames and its
#   manoeuvre and distance drawn on the HUD, only while Waze's banner is
#   there, the stream is live and the map is on the map target; the HUD's own
#   content (speed, limits, warnings, BMW's or Apple's/Google's guidance)
#   always wins: the arrows never take the HUD slot over and give way at once.
# off: nothing on the HUD. video: the map video itself on the HUD (the old
#   `run hud`). The cluster map is the same in every mode.
hud_mode = arrows
# native (the default, validated on a BMW with iDrive 7 (MGU)): BMW's own HUD arrows and
#   distance, as for Apple Maps and Google Maps: the turn is
#   written to /run/jap-waze-on-cluster/hud.json and the jap-waze-on-cluster-hudguide
#   service sends it to the navigation's ProjectedModeGuiding (carplay's
#   calls). Nothing is drawn by us.
# image (optional fallback): our own drawing as a layer of the shared
#   renderer's hud target; needs templates (README.md "HUD arrows").
hud_backend = native
# The image on the hud target (cluster-render's hud_size, 800x480, is a
# guess). CAR-ONLY: the HUD's real size and where it is visible.
hud_rect = 240x160+280+160
# Where the turn is read. First the CarPlay card iOS draws on the centre
# screen (the arrow, the distance; there only while CarPlay is in front),
# grabbed with the unit's winston-grabber at 1920x720, 4 fps, while the
# arrows are on: hud_card = 1. Its rects are in centre-screen pixels; the
# card is there when hud_card_plain_rect is flat black or white. The card
# moves: with lane arrows under it the distance is at y 46-78, else 61-93,
# from x 244 (the car, 2026-11-04); the rects take both.
hud_card = 1
hud_card_icon_rect = 85x90+150+26
hud_card_dist_rect = 320x60+236+40
hud_card_plain_rect = 80x80+580+30
hud_card_roi = 580x220+120+0
# Without the card, hud_reader = card shows no arrow: the HUD clears 3 s
# after the card goes (CarPlay's card is the one source; on 2026-11-04 the
# map's arrow disagreed with it). map reads the cluster frame (tex_size
# pixels) instead: the white arrow Waze draws on
# the route at the next junction, its stem the end nearer the car's chevron
# (hud_car_x/y), no distance; luma at or above hud_min_luma is white.
# banner: an instruction card in the cluster frame (Waze draws none there,
# seen 2026-11-03), read with templates from hud_icon_rect/hud_dist_rect.
hud_reader = card
hud_car_x = 544
hud_car_y = 360
hud_min_luma = 235
# A dump keeps hud_roi of the cluster frame and hud_card_roi of the centre
# screen, named after the reading.
hud_roi = 1088x480+0+0
hud_icon_rect = 88x88+294+80
hud_dist_rect = 200x56+390+96
# Templates: icon-<manoeuvre>-<n>.pgm and dist-<text>-<n>.pgm, made by
# tools/hud_templates.py from labelled dumps; readable by hmi_5000. The
# card's distance uses the dist-*.pgm only: tools/hud_font_templates.py
# renders them from SF Pro Bold. Read again within 10 s of a change.
hud_templates = /var/opt/jap-waze-on-cluster/hud-templates
# 1: our own arrow drawings as icon templates when the folder has none.
# They are not Waze's icons, so 0: no arrows until the calibration.
hud_builtin_icons = 0
# The icon's least match (percent) for a banner to count.
hud_min_score = 60
# A frame read at most this often (250: the grabber's 4 a second); a reading
# shown once it was read hud_stable times in a row: about half a second
# behind the card (at 2 a second and 400 ms it was up to 1.5 s: 190 m on the
# HUD for the card's 170 m at 64 km/h).
hud_sample_ms = 250
hud_stable = 2
# Calibration: while hud_dump_flag exists (touch it), or after `run
# hud-dump`, the banner, icon and distance crops are written as PNG to
# hud_dump_dir once a second, at most hud_dump_max sets a run.
hud_dump_flag = /tmp/jap-woc-hud-dump
hud_dump_dir = /tmp/jap-woc-hud
hud_dump_max = 200

verbose = 0
