<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How waze-hud works: CarPlay to the head unit, then to the instrument cluster and the HUD</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa7b8"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#33c3f0"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6fd18a"/></marker>
  </defs>
  <rect width="1200" height="600" rx="16" fill="#0f141b"/>

  <!-- head unit frame -->
  <rect x="220" y="30" width="710" height="540" rx="14" fill="#141b24" stroke="#2c3949" stroke-width="2"/>
  <text x="244" y="62" font-size="17" font-weight="700" fill="#c9d3df">iDrive 7 head unit (MGU)</text>

  <!-- phone -->
  <rect x="30" y="200" width="160" height="150" rx="22" fill="#1b2330" stroke="#3a4a5e" stroke-width="2"/>
  <text x="110" y="250" font-size="19" font-weight="700" fill="#e6edf5" text-anchor="middle">iPhone</text>
  <text x="110" y="280" font-size="16" fill="#9aa7b8" text-anchor="middle">Waze</text>
  <text x="110" y="304" font-size="16" fill="#9aa7b8" text-anchor="middle">over CarPlay</text>
  <line x1="190" y1="275" x2="246" y2="275" stroke="#9aa7b8" stroke-width="3" marker-end="url(#a)"/>

  <!-- carplay -->
  <rect x="250" y="90" width="170" height="380" rx="10" fill="#1b2330" stroke="#3a4a5e" stroke-width="2"/>
  <text x="335" y="255" font-size="18" font-weight="700" fill="#e6edf5" text-anchor="middle">carplay</text>
  <text x="335" y="281" font-size="15" fill="#9aa7b8" text-anchor="middle">BMW's program,</text>
  <text x="335" y="301" font-size="15" fill="#9aa7b8" text-anchor="middle">patched to send</text>
  <text x="335" y="321" font-size="15" fill="#9aa7b8" text-anchor="middle">the cluster map</text>

  <!-- lane 1: centre screen -->
  <line x1="420" y1="130" x2="956" y2="130" stroke="#9aa7b8" stroke-width="3" marker-end="url(#a)"/>
  <text x="688" y="118" font-size="15" fill="#9aa7b8" text-anchor="middle">the CarPlay screen, Waze's turn card at the top left</text>

  <!-- lane 2: cluster map -->
  <line x1="420" y1="270" x2="466" y2="270" stroke="#33c3f0" stroke-width="3" marker-end="url(#am)"/>
  <rect x="470" y="225" width="210" height="90" rx="10" fill="#1b2330" stroke="#33c3f0" stroke-width="2"/>
  <text x="575" y="256" font-size="16" font-weight="700" fill="#e6edf5" text-anchor="middle">jap-waze-on-cluster</text>
  <text x="575" y="280" font-size="14" fill="#9aa7b8" text-anchor="middle">captures the map video</text>
  <text x="575" y="299" font-size="14" fill="#9aa7b8" text-anchor="middle">(H.264) and decodes it</text>
  <line x1="680" y1="270" x2="716" y2="270" stroke="#33c3f0" stroke-width="3" marker-end="url(#am)"/>
  <rect x="720" y="225" width="185" height="90" rx="10" fill="#1b2330" stroke="#33c3f0" stroke-width="2"/>
  <text x="812" y="256" font-size="16" font-weight="700" fill="#e6edf5" text-anchor="middle">cluster-render</text>
  <text x="812" y="280" font-size="14" fill="#9aa7b8" text-anchor="middle">draws it in the</text>
  <text x="812" y="299" font-size="14" fill="#9aa7b8" text-anchor="middle">cluster's map area</text>
  <line x1="905" y1="270" x2="956" y2="270" stroke="#33c3f0" stroke-width="3" marker-end="url(#am)"/>

  <!-- lane 3: HUD -->
  <line x1="420" y1="420" x2="466" y2="420" stroke="#6fd18a" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="470" y="375" width="210" height="90" rx="10" fill="#1b2330" stroke="#6fd18a" stroke-width="2"/>
  <text x="575" y="406" font-size="16" font-weight="700" fill="#e6edf5" text-anchor="middle">reads the turn card</text>
  <text x="575" y="430" font-size="14" fill="#9aa7b8" text-anchor="middle">from a screen grab:</text>
  <text x="575" y="449" font-size="14" fill="#9aa7b8" text-anchor="middle">the turn and the distance</text>
  <line x1="680" y1="420" x2="716" y2="420" stroke="#6fd18a" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="720" y="375" width="185" height="90" rx="10" fill="#1b2330" stroke="#6fd18a" stroke-width="2"/>
  <text x="812" y="406" font-size="16" font-weight="700" fill="#e6edf5" text-anchor="middle">hudguide</text>
  <text x="812" y="430" font-size="14" fill="#9aa7b8" text-anchor="middle">tells BMW's navigation,</text>
  <text x="812" y="449" font-size="14" fill="#9aa7b8" text-anchor="middle">as CarPlay does for Maps</text>
  <line x1="905" y1="420" x2="956" y2="420" stroke="#6fd18a" stroke-width="3" marker-end="url(#ah)"/>

  <!-- the app -->
  <rect x="470" y="500" width="435" height="46" rx="10" fill="none" stroke="#3a4a5e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="687" y="529" font-size="15" fill="#9aa7b8" text-anchor="middle">Waze HUD app in the iDrive menu: status, enable, disable, logs</text>

  <!-- displays -->
  <rect x="960" y="85" width="210" height="90" rx="10" fill="#202a38" stroke="#9aa7b8" stroke-width="2"/>
  <text x="1065" y="124" font-size="17" font-weight="700" fill="#e6edf5" text-anchor="middle">Centre screen</text>
  <text x="1065" y="150" font-size="14" fill="#9aa7b8" text-anchor="middle">CarPlay, as usual</text>

  <rect x="960" y="225" width="210" height="90" rx="10" fill="#202a38" stroke="#33c3f0" stroke-width="2"/>
  <text x="1065" y="264" font-size="17" font-weight="700" fill="#e6edf5" text-anchor="middle">Instrument cluster</text>
  <text x="1065" y="290" font-size="14" fill="#9aa7b8" text-anchor="middle">Waze's map in Map view</text>

  <rect x="960" y="375" width="210" height="90" rx="10" fill="#202a38" stroke="#6fd18a" stroke-width="2"/>
  <text x="1065" y="414" font-size="17" font-weight="700" fill="#e6edf5" text-anchor="middle">Head-up display</text>
  <text x="1065" y="440" font-size="14" fill="#9aa7b8" text-anchor="middle">BMW's arrow and distance</text>
</svg>
